name: CI

on:
  push:
    branches: [main, fintask-showcase]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: fintask
          POSTGRES_PASSWORD: fintask-ci
          POSTGRES_DB: fintask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintask -d fintask"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: fintask
      POSTGRES_PASSWORD: fintask-ci
      POSTGRES_DB: fintask
      POSTGRES_TIMEOUT: 10s
      RESTAPI_POSTGRES_INTEGRATION: "1"
      DATABASE_URL: postgres://fintask:fintask-ci@127.0.0.1:5432/fintask?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Migrations up
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          migrate -path migrations -database "$DATABASE_URL" up
      - name: Go tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Go vet
        run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Migration round trip
        run: |
          migrate -path migrations -database "$DATABASE_URL" down -all
          migrate -path migrations -database "$DATABASE_URL" up
      - name: Frontend verify
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Docker build
        run: docker build -f cmd/todoapp/Dockerfile -t fintask:ci .

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/todoapp/Dockerfile
          push: true
          tags: |
            ghcr.io/lislisich/fintask:${{ github.ref_name }}
            ghcr.io/lislisich/fintask:latest
