schemes:
- https
- http
securityDefinitions:
  BearerAuth:
    description: 'Access JWT в формате: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
  CSRFToken:
    description: CSRF-токен для изменяющих запросов с cookie-сессией
    in: header
    name: X-CSRF-Token
    type: apiKey
  SessionCookie:
    description: Защищенная cookie-сессия браузера
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
